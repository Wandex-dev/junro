<script>const G={"q": [["夕立に降られました。目の前に古い建物があります。", ["庇の下で止むのを待つ", "戸が開いていれば入ってみる", "濡れてでも目的地へ走る", "誰かが来るまで様子を見る"]], ["床に矢印が描いてあります。", ["とりあえず従う。楽だから", "矢印のない方が気になる", "誰が描いたのか調べる", "前の人についていく"]], ["バスの降車ボタンが、もう誰かに押されています。", ["自分の分は押さなくていいと安心する", "念のためもう一度押す", "本当に止まるのか運転手に聞く", "降りる人がいたら一緒に降りる"]], ["道を聞かれました。", ["いちばん安全な道を丁寧に教える", "自分がよく行く抜け道を教える", "地図を見せて、本人に選んでもらう", "一緒に行きましょうと声をかける"]], ["人生で多いのはどちら？", ["決めてもらえて助かった", "寄り道して怒られた", "調べすぎて遅れた", "言い出せずにそのままにした"]]], "r": [{"k": "案内係", "t": "誰も迷わせない案内係", "d": "あなたは人が迷うのを放っておけません。正しい道を知っていて、親切に教えます。その親切で、相手は二度と自分で道を選ばなくなるかもしれません。", "w": "順路", "u": "./", "c": "この町の案内係は、今も受付にいます。"}, {"k": "寄り道", "t": "列から出る寄り道の子", "d": "あなたは言われた道より、気になる道を歩きます。よく怒られます。ただ、ごはんを見つけるのは、たいてい列から出たやつです。", "w": "順路", "u": "./", "c": "床の矢印を、無視できますか。"}, {"k": "記録", "t": "資料室に入り浸る記録係", "d": "あなたは自分で調べないと気が済みません。遅くなりますが、誰も読まない報告書の最後の一行に気づくのは、あなたのような人です。", "w": "終点案内", "u": "shuten/", "c": "運賃表の、紙が貼られた札を見てください。"}, {"k": "乗客", "t": "前を向いて座る乗客", "d": "あなたは周りを見て動きます。誰かが立てば、自分も立つつもりでいます。優しい人です。ただ、そのバスは、もうずいぶん走っています。", "w": "終点案内", "u": "shuten/", "c": "ランプは最初から灯っています。"}]};let i=0;const s=[0,0,0,0];const $=document.getElementById('app');const esc=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function card(r){const c=document.createElement('canvas');c.width=1200;c.height=630;const x=c.getContext('2d');x.fillStyle='#120e0a';x.fillRect(0,0,1200,630);const g=x.createRadialGradient(600,315,40,600,315,640);g.addColorStop(0,'#c8402c55');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,1200,630);x.strokeStyle='#efe6d2';x.lineWidth=3;x.strokeRect(28,28,1144,574);x.fillStyle='#efe6d2';x.textAlign='center';x.font="600 36px 'Hiragino Mincho ProN',serif";x.fillText('矢渡町 住民診断',600,120);x.font="700 74px 'Hiragino Mincho ProN',serif";x.fillText(r.t,600,270);x.font="400 34px 'Hiragino Mincho ProN',serif";x.fillText(r.c,600,370);x.font="700 26px 'Hiragino Kaku Gothic ProN',sans-serif";x.fillText('wandex-dev.github.io/junro/shindan.html｜矢印書房',600,540);const a=document.createElement('a');a.download='矢渡町住民診断.png';a.href=c.toDataURL('image/png');a.click()}
function show(){if(i<G.q.length){const [q,o]=G.q[i];$.innerHTML=`<div class="bar"><i style="width:${i/G.q.length*100}%"></i></div><div class="q"><b>Q${i+1}. ${esc(q)}</b>${o.map((t,n)=>`<button class="opt" data-n="${n}">${esc(t)}</button>`).join('')}</div>`;$.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{s[+b.dataset.n]++;i++;show();scrollTo(0,0)});return}
const m=s.indexOf(Math.max(...s));const r=G.r[m];const txt=`矢渡町 住民診断の結果：${r.t}\n${r.c}\n\n#矢渡町住民診断\nhttps://wandex-dev.github.io/junro/shindan.html`;$.innerHTML=`<div class="res"><p class="lead" style="margin:0">あなたは</p><h2>${esc(r.t)}</h2><p>${esc(r.d)}</p><p><b>${esc(r.c)}</b></p><a class="cta p" href="${r.u}">あなたに合う話『${r.w}』を遊ぶ（無料）</a></div><div class="q"><b style="font-size:15px">結果を残す</b><button class="opt" id="pc" style="text-align:center">結果の画像を保存</button><button class="opt" id="cp" style="text-align:center">文面をコピー</button><a class="opt" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${encodeURIComponent(txt)}">Xに投稿する</a></div><p><a class="cta" href="https://yajirushi-shobo.booth.pm/items/9098612">『終点案内』のPDFを無料でもらう（BOOTH）</a><a class="cta" href="shop.html">作品一覧</a></p><p><button class="opt" id="re" style="text-align:center">もう一度診断する</button></p>`;
document.getElementById('pc').onclick=()=>card(r);document.getElementById('cp').onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(txt);e.target.textContent='コピーしました'};document.getElementById('re').onclick=()=>{i=0;s.fill(0);show();scrollTo(0,0)}}show();</script><footer>矢渡町、登場する人物・団体は架空のものです。作品は「ダイスタス・チーム」が権利を有する『エモクロアTRPG』の二次創作で、公式とは関係ありません。制作過程でAIを活用しています。<br>発行 矢印書房 <a href="https://yajirushi-shobo.booth.pm/">BOOTH</a></footer></main></body></html>
