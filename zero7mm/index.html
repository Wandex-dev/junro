<style>

  --line: #c0c9d4;

}
@media (prefers-color-scheme: dark) {

    --paper: #090d13; --panel: #0f151e; --ink: #dde3ec; --muted: #8692a3; --line: #243042;
    --her: #ffa94a; --her-ink: #1c1205; --glass: #121b27; --lattice: rgba(221, 227, 236, 0.05);

}
:root[data-theme="dark"] {
  --paper: #090d13; --panel: #0f151e; --ink: #dde3ec; --muted: #8692a3; --line: #243042;
  --her: #ffa94a; --her-ink: #1c1205; --glass: #121b27; --lattice: rgba(221, 227, 236, 0.05);

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }

.mono { font-family: var(--num); }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }

.bar[hidden] { display: none; }

.section-fig .t { font-family: var(--num); font-size: 9px; fill: var(--muted); letter-spacing: .08em; }
.section-fig .tj { font-family: var(--body); font-size: 10px; fill: var(--muted); }
.section-fig .g-line { stroke: var(--ink); stroke-width: 1.2; }
.section-fig .hatch { stroke: var(--ink); stroke-width: .6; opacity: .45; }
.section-fig .dim { stroke: var(--ink); stroke-width: .8; fill: none; }
.section-fig .dimtxt { font-family: var(--num); font-size: 12px; fill: var(--ink); }

.prompt { margin: 0; font-weight: 700; font-size: 17px; }

form.answer { display: grid; gap: 6px; }
form.answer label { font-size: 13px; color: var(--muted); }
.row { display: flex; gap: 8px; }

.hints ol { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; font-size: 15px; }
.hints li::marker { font-family: var(--num); color: var(--muted); }

.after { border: 1.5px solid var(--her); padding: 16px; display: grid; gap: 10px; background: var(--panel); }

.sky .sun { fill: #f4b65c; opacity: 0; }
.sky.day .sun { opacity: 1; }
.sky .horizon { opacity: 0; }
.sky.day .horizon, .sky.twilight .horizon { opacity: 1; }

.sky .dust { opacity: 0; }
.sky.night .dust, .sky.twilight .dust { opacity: 1; }

.sky .cons { opacity: 0; }
.sky.twilight .cons { opacity: 1; transition-delay: 1.2s; }
.sky .cons line { stroke: #eef2ff; stroke-width: 1.2; opacity: .75; stroke-linecap: round; }
.sky .cons circle { fill: #fff; }
.sky .cons text { font-family: var(--num); font-size: 7px; fill: #f6d8b8; }
.sky-label { position: absolute; left: 10px; top: 8px; font-family: var(--num); font-size: 10px; letter-spacing: .12em; color: rgba(20, 20, 30, .6); }
.sky.night .sky-label, .sky.twilight .sky-label { color: #f3d6b5; }

/* 第3章 計器 */
.meter { border: 1px solid var(--ink); border-radius: 2px; padding: 10px 14px 12px; display: grid; gap: 8px; min-width: 230px; background: var(--paper); }
.meter-top, .meter-bottom { display: flex; justify-content: space-between; gap: 16px; font-family: var(--num); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.live { display: inline-flex; align-items: center; gap: 6px; }

  background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, .6) 46%, transparent 60%); background-size: 260% 100%; background-position: 120% 0; }

@keyframes gloss { 0% { opacity: 1; background-position: 120% 0; } 100% { opacity: 0; background-position: -40% 0; } }

/* 持ち帰り */
.take { display: grid; gap: 14px; margin-top: 28px; border-top: 1px solid #3a3631; padding-top: 22px; }

    x.fillStyle = mute; x.font = MONO('400 24px'); x.fillText('DWG No. 0x07   /   No. ' + state.serial, W / 2, 372);
    x.textAlign = 'left'; x.fillStyle = ink; x.font = ZEN('500 52px'); x.fillText((name || '測量協力者') + '　殿', 150, 484);
    x.lineWidth = 2; x.beginPath(); x.moveTo(150, 506); x.lineTo(W - 150, 506); x.stroke();
    x.font = ZEN('500 34px');
    const body = 'あなたは、厚さ0.7ミリのカバーガラスの向こう側に広がる裏面において、測量士ユクリの測量に協力し、出口の位置を確定させました。その働きをたたえ、ここに証明します。';
    wrapText(x, body, W - 300).forEach((l, i) => x.fillText(l, 150, 584 + i * 60));
    const rows = recordRows(), ty = 830, rh = 70;
    x.strokeStyle = 'rgba(27, 35, 48, .35)'; x.lineWidth = 1.5;
    rows.forEach(([k, v], i) => {
      const y = ty + i * rh; x.beginPath(); x.moveTo(150, y); x.lineTo(W - 150, y); x.stroke();
      x.fillStyle = mute; x.font = ZEN('500 30px'); x.textAlign = 'left'; x.fillText(k, 170, y + 46);
      x.fillStyle = ink; x.font = MONO('500 32px'); x.textAlign = 'right'; x.fillText(v, W - 170, y + 46);
    });
    x.beginPath(); x.moveTo(150, ty + rows.length * rh); x.lineTo(W - 150, ty + rows.length * rh); x.stroke();
    // 断面図
    const gx = 150, gy = 1430;
    x.strokeStyle = ink; x.lineWidth = 2; x.beginPath(); x.moveTo(gx, gy); x.lineTo(gx + 380, gy); x.moveTo(gx, gy + 34); x.lineTo(gx + 380, gy + 34); x.stroke();
    x.save(); x.beginPath(); x.rect(gx, gy, 380, 34); x.clip(); x.lineWidth = 1; x.strokeStyle = 'rgba(27, 35, 48, .45)';
    for (let k = gx - 40; k < gx + 400; k += 12) { x.beginPath(); x.moveTo(k, gy + 34); x.lineTo(k + 34, gy); x.stroke(); } x.restore();
    x.lineWidth = 1.5; x.beginPath(); x.moveTo(gx + 410, gy - 24); x.lineTo(gx + 410, gy + 58); x.stroke();
    x.fillStyle = ink; x.font = MONO('400 26px'); x.textAlign = 'left'; x.fillText('0.7', gx + 424, gy + 28);
    x.strokeStyle = 'rgba(27, 35, 48, .25)'; x.lineWidth = 1;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 19; c++) x.strokeRect(gx + c * 20, gy + 54 + r * 20, 20, 20);
    const p = serialCell(); x.fillStyle = her; x.fillRect(gx + (p.c % 19) * 20 + 2, gy + 54 + (p.r % 4) * 20 + 2, 16, 16);
    x.fillStyle = mute; x.font = ZEN('500 20px'); x.fillText('表　あなた', gx, gy - 18); x.fillText('裏面', gx, gy + 160);
    // 署名と印
    x.textAlign = 'left'; x.fillStyle = mute; x.font = ZEN('500 28px'); x.fillText('裏面測量士', 700, 1450);
    x.fillStyle = ink; x.font = '68px "DotGothic16", sans-serif'; x.fillText('ユクリ', 700, 1540);
    drawSeal(x, 1010, 1490, 150);
    x.textAlign = 'center'; x.fillStyle = mute; x.font = MONO('400 18px'); x.fillText('0.7mm  画面の裏の測量士  /  CLEAR RECORD', W / 2, H - 112);
    return cv;
  }
  async function saveCanvas(cv, filename) {
    const msg = $('#save-msg');
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    if (!blob) { msg.textContent = '画像を作れませんでした。画像を長押しして保存してください。'; return; }
    let dl = null; try { dl = await dlP; } catch (e) {}
    if (dl && dl.save) {
      try { await dl.save({ filename, data: blob }); msg.textContent = '保存しました。'; return; }
      catch (e) { if (e && e.code === 'declined') { msg.textContent = '保存を取りやめました。'; return; }
        if (e && e.code === 'rate_limited') { msg.textContent = '少し待ってから、もう一度押してください。'; return; } }
    }
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      msg.textContent = '保存を開始しました。保存されない場合は、画像を長押ししてください。';
    } catch (e) { msg.textContent = 'この環境では保存ボタンが使えません。画像を長押しして保存してください。'; }
  }
  async function mountTakeaways() {
    const sample = '画面の裏の測量士測量証明書殿あなたは厚さミリのカバーガラス向こう側に広がる裏面において測量士ユクリ協力出口位置確定させましたその働きたたえここ証明します完了日にかかった時間から目を離した回数空切り替え時刻通信断っていヒント開表分秒年月日' + (state.name || '') + '0123456789.:/-ACEFHJKLMNPRTXY';
    await fontsReady(sample);
    const wp = drawWallpaper(), img = $('#wp-img'); if (!img) return;
    img.src = wp.toDataURL('image/png');
    $('#wp-save').addEventListener('click', () => saveCanvas(wp, `07mm_wallpaper_${state.serial}.png`));
    const nm = $('#cert-name'); nm.value = state.name || '';
    let cert = null;
    $('#cert-make').addEventListener('click', async () => {
      state.name = nm.value.trim().slice(0, 16); save();
      await fontsReady(state.name + sample);
      cert = drawCert(state.name);
      const ci = $('#cert-img'); ci.src = cert.toDataURL('image/png'); ci.hidden = false; $('#cert-save').hidden = false;
      $('#cert-make').textContent = '名前を変えてつくり直す';
    });
    $('#cert-save').addEventListener('click', () => cert && saveCanvas(cert, `07mm_certificate_${state.serial}.png`));
  }

  /* ---------- 起動 ---------- */
  function start(data) {
    const stored = (data && Object.keys(data).length) ? data : load();
    state = Object.assign(fresh(), stored || {});
    if (!state.serial) state.serial = makeSerial();
    if (state.unl > 0) state.peeled = true;
    save();
    if (state.r4) fade = 1;
    go(state.scr && (state.scr === 'title' || ORDER.indexOf(state.scr) <= state.unl) ? state.scr : 'title');
    const redraw = () => { for (const k in bmCache) delete bmCache[k]; if (state.scr === 'c5') renderStrips(); };
    if (document.fonts && document.fonts.load) document.fonts.load('60px "DotGothic16"', SEAL.w4 + SEAL.w5 + '？').then(redraw, () => {});
  }
  window.claude?.hot?.snapshot?.(() => state);
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
