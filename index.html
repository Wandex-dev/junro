const G={"nodes": {"start": {"id": "start", "title": "雨宿り", "text": ["夕立だった。あなたは傘を持っておらず、ちょうど目についた古い建物の庇に駆け込んだ。", "〈町立 郷土記念館〉。色褪せた看板の下で硝子戸が半分開いており、奥から灯りが漏れている。雨はしばらく止みそうにない。", "戸をくぐると、受付の小窓に和服の女性が座っていた。女性はあなたを見ると、何も聞かずに一枚の紙片を差し出す。", "「雨がお強いですから、どうぞ。入館料は結構です。順路に沿ってお進みください。順路の通りに歩いていただければ、迷うことはございませんので」", "紙片には館内図があった。受付の先に廊下が一本。廊下に面して、扉が六つ。", "そして床には、白いペンキで矢印が描かれている。"], "choices": [{"label": "廊下へ進む", "to": "hall_first"}]}, "hall_first": {"id": "hall_first", "title": "廊下", "text": ["廊下は思ったより長い。左右に扉が三つずつ、札にはそれぞれ部屋の名前が書かれている。", "床の矢印は、どの扉の前でも少しだけ曲がって、扉の下へ入り込んでいた。どこから入っても構わないように見える。", "ふと振り返ると、入ってきた硝子戸は見えなかった。受付の小窓の灯りだけが、遠くに小さく残っている。", "急ぐ理由もない。雨が止むまで、見て回ればいい。"], "choices": [{"label": "廊下の扉を選ぶ", "to": "demo_hall"}]}, "book": {"id": "book", "title": "記帳の間", "text": ["部屋の中央の台に、分厚い記帳が開かれている。来館者の名前と日付。その横に、細かな字で何かが書き足されていた。", "墨はまだ乾いていない頁がある。今日の日付の行だ。"], "arrive": true, "room": "book", "check": {"skills": "〈＊調査〉〈検索〉〈洞察〉など", "ok": "demo_ok", "ng": "demo_ng"}}, "book_retry": {"id": "book_retry", "title": "自分の目で", "text": ["帳面の上の矢印を袖で隠して、あなたは最初の頁から文字を拾い直す。動いて見える字は、指で押さえれば止まった。"], "check": {"skills": "〈＊調査〉〈検索〉〈洞察〉など", "ok": "demo_ok", "ng": "demo_ng"}}, "demo_hall": {"id": "demo_hall", "title": "廊下の扉", "text": ["矢印は、すべての扉の下へ続いている。", "時計の間。標本の間。地図の間。写真の間。民具の間。どの扉にも、まだ鍵がかかっているように見えた（製品版で入れます）。", "ひとつだけ、細く開いている扉がある。札には「記帳の間」とあった。"], "choices": [{"label": "記帳の間に入る", "to": "book"}]}, "demo_ok": {"id": "demo_ok", "title": "歩いた順番", "text": ["書き足されているのは、部屋の名前だった。来館者ごとに、時計、標本、地図……と順に並んでいる。その人が歩いた順番だ。", "同じ順番の人は一人もいない。誰もが、自分で選んだ順に歩いている。", "そして全員の行の末尾に、同じ言葉がある。〈順路通り〉。", "今日の日付の行を見る。あなたの名前が、あなたの字で書いてある。書いた覚えはない。その後ろには、あなたがここまで歩いてきた部屋の名前が、正しい順番で並んでいた。", "墨が乾いていないのは、次の部屋の分だった。"], "set": [], "res": {"s": 3, "u": 1}, "choices": [{"label": "次の部屋へ", "to": "demo_end"}]}, "demo_ng": {"id": "demo_ng", "title": "親切な札", "text": ["名前が多すぎる。読もうとするたび、墨の字が少しずつ動いて見える。", "足元の矢印が、台の脚を登って帳面の上まで続いていた。さっきまでは、なかったはずだ。"], "choices": [{"label": "矢印に従う（楽だが、影響を受ける）", "to": "demo_help"}, {"label": "矢印を無視して、自分で調べ直す", "to": "book_retry"}]}, "demo_help": {"id": "demo_help", "title": "教えられたこと", "res": {"s": 4, "u": 1}, "text": ["矢印は今日の日付の行を指している。あなたの名前。あなたの字。その後ろに、あなたが歩いた部屋の順番。そして〈順路通り〉の文字。", "書いた覚えはない。", "墨が乾いていないのは、次の部屋の分だった。"], "choices": [{"label": "次の部屋へ", "to": "demo_end"}]}, "demo_end": {"id": "demo_end", "title": "体験版はここまでです", "text": ["記帳の墨は、まだ乾いていない。扉はあと五つ。床の矢印は、今も続いている。", "受付の女性は言いました。順路の通りに歩いていただければ、迷うことはございません、と。"], "ending": "体験版おわり"}}, "rooms": {"clock": "時計の間", "bug": "標本の間", "map": "地図の間", "book": "記帳の間", "photo": "写真の間", "tool": "民具の間"}, "arrival": {"clock": {"start": "最初の扉を選んだ途端、背中で受付の鈴が小さく鳴った。扉の向こうからは、秒を刻む音だけが聞こえている。", "bug": "虫の脚の細さが目に残ったまま、扉を押す。無数の針が、あの脚と同じ細さで止まっている。", "map": "地図の上で辿った線が、まだ指先に残っている。ここでは線の代わりに、針がどれも同じ方を指していた。", "book": "他人の名前を読みすぎた目に、文字盤の数字は妙に優しく見えた。", "photo": "写真の中の人々がこちらを見ていた感触を、秒針の音がゆっくりと削っていく。", "tool": "手に残る木の匂いと入れ替わりに、油と真鍮の匂いが鼻に届く。"}, "bug": {"start": "最初の扉を選んだ途端、防虫剤の匂いが喉に張りついた。受付の鈴は、まだ背中で揺れている。", "clock": "耳の奥に秒針の音を連れたまま入ると、虫たちの静けさがいっそう深く感じられた。", "map": "地図の等高線のように、ここの棚も几帳面に揃えられている。", "book": "名簿の次は標本だ。どちらも、留められて並んでいるという点では変わらない。", "photo": "写真の人々の視線から逃げてきたのに、ここには何百という複眼が並んでいる。", "tool": "使い込まれた道具のあとでは、一度も使われなかった翅の新しさが不気味だった。"}, "map": {"start": "最初の扉を選んだ途端、古い紙の匂いが流れ出してきた。壁いっぱいに町が貼られている。", "clock": "止まった時間の部屋を出ると、今度は止まった町があった。", "bug": "翅の模様を見続けた目には、町の区画まで翅脈のように見える。", "book": "名簿の住所をいくつか覚えてしまった。そのうちのいくつかが、もう壁の地図の中に見つかる。", "photo": "写真で見た通りが、ここでは細い線になっていた。", "tool": "鍬や鎌を握っていた人々の町は、上から見ると驚くほど小さい。"}, "book": {"start": "最初の扉を選んだ途端、墨の匂いがした。部屋の中央に、開かれた帳面が一冊だけある。", "clock": "秒針の音から離れると、今度は自分の呼吸が帳面の頁を揺らしそうで怖くなる。", "bug": "名札の付いた虫たちの次は、名札の付いた人間たちだった。", "map": "地図に町の名前を読んだ続きのように、帳面には人の名前が続いている。", "photo": "写真で見た顔の持ち主が、この中に書かれているのだろうかと思う。", "tool": "道具の持ち主の名は残らない。だがここには、名前だけが残っている。"}, "photo": {"start": "最初の扉を選んだ途端、視線を感じた。壁を埋めた写真が、いっせいにこちらを向いているように見える。", "clock": "止まった時間の次は、切り取られた時間だ。写真の中の時計は、どれも読めない。", "bug": "標本の虫は目を閉じられなかった。ここの人々も、同じ目をしている。", "map": "線だった町が、ここでは人の立つ通りになっている。", "book": "さっき読んだ名前のどれかが、この中で笑っているのかもしれない。", "tool": "さっき見た鍬を担いだ男が、写真の隅に写っている。"}, "tool": {"start": "最初の扉を選んだ途端、乾いた藁と土の匂いがした。この建物でいちばん人の気配がする部屋だった。", "clock": "正確なものの部屋を出ると、すり減ったものの部屋があった。少しだけ息がしやすい。", "bug": "防虫剤の匂いが薄れ、藁の匂いに変わる。ようやく生き物の匂いだ、と思う。", "map": "地図の小ささに比べて、ここの道具はどれも人の手の大きさをしている。", "book": "名前ばかり読んだあとで、名前のないものたちを前にすると落ち着く。", "photo": "写真の中で誰かが握っていた鎌が、そのまま壁に掛かっている。"}}, "number": {}, "off": {}, "emotion": "支配（関係）", "escape": 0, "total": 0, "demo": true, "booth": "https://yajirushi-shobo.booth.pm/items/9088858", "site": "https://wandex-dev.github.io/junro/"};

$('go').onclick=()=>{S={name:$('nm').value.trim()||'あなた',lv:Math.max(1,Math.min(9,+$('lv').value||1)),lv0:Math.max(1,Math.min(9,+$('lv').value||1)),mt:$('mt').value,flags:[],prev:'start',node:'start',trail:[],entered:false,logs:[]};go('start')};
if($('cont'))$('cont').onclick=()=>{S=load();render()}}
function resDice(){const L=S.lv;return S.mt==='full'?L*2:S.mt==='root'?L+1:L}
function doRes(r){const R=roll(resDice(),r.s);let up=0;if(R.s>=1){up=r.u;if(R.s>=3)up+=1;S.lv+=up}return `<div class="sys">共鳴判定（強度${r.s}/上昇${r.u}）/ ∞共鳴感情：[${G.emotion}]<br>出目 ${R.r.join(', ')} → 成功数 ${R.s}<br><span class="roll">${up?`〈∞共鳴〉が ${up} 上昇して ${S.lv} になった`:'共鳴は上昇しなかった'}</span></div>`}
function go(id){const n=G.nodes[id];const fromRoom=S.prevRoom||'start';S.node=id;let pre='';
(n.set||[]).forEach(f=>{if(!S.flags.includes(f))S.flags.push(f)});
if(n.room){if(!S.flags.includes('v_'+n.room))S.flags.push('v_'+n.room);S.trail.push(n.room);pre+=`<p>${esc(G.arrival[n.room][fromRoom])}</p>`;S.prevRoom=n.room}
if(n.res)pre+=doRes(n.res);
if(n.lower){const o=S.lv;S.lv=Math.max(1,S.lv-n.lower);pre+=`<div class="sys roll">〈∞共鳴〉が ${o} から ${S.lv} になった</div>`}
S.pre=pre;if(S.lv>=10&&id!=='demo_end'){S.pre=pre;S.lv=10;S.dev=true;return go2dev(pre)}S.result='';save();render();scrollTo(0,0)}
function go2dev(pre){S.node='demo_end';S.pre=pre;S.result='';save();render();scrollTo(0,0)}
function render(){const n=G.nodes[S.node];const b=$('bar');b.hidden=false;const rooms=S.trail.map(r=>G.rooms[r]).join(' → ')||'まだどこにも入っていない';
const notes={};
const got=S.flags.filter(f=>notes[f]).map(f=>notes[f]);
b.innerHTML=`<b>${esc(S.name)}</b>　〈∞共鳴〉<b>${S.lv}</b>　<details style="display:inline;margin:0"><summary style="display:inline;cursor:pointer">記録</summary><div>歩いた順番：${esc(rooms)}<br>${got.map(esc).join('<br>')||'記録なし'}</div></details>`;
let h=`<h2>${esc(n.title)}</h2>${S.pre||''}`;n.text.forEach(t=>h+=`<p>${esc(t)}</p>`);
if(n.ending){h+=`<a class="btn" href="${G.booth}" target="_blank" rel="noopener" style="background:var(--acc);color:#fff;border-color:var(--acc);text-align:center;font-weight:600;text-decoration:none">続きを製品版で遊ぶ（¥300）</a><p class="small" style="margin:6px 0 14px">全6部屋・結末4種・30〜60分。シナリオ本PDFとパソコン向けプレイ版HTMLが付きます。</p><a class="btn" href="https://x.com/intent/post?text=${encodeURIComponent('エモクロアTRPGのひとり用シナリオ『順路』の体験版を遊びました。 #エモクロアTRPG #順路TRPG')}${G.site?'&url='+encodeURIComponent(G.site):''}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Xで共有する（ネタバレなしの定型文）</a><button class="btn" id="again" style="text-align:center">最初に戻る</button>`;clearSave();$('app').innerHTML=h;$('again').onclick=()=>{S=null;$('bar').hidden=true;title()};return}
if(n.check){h+=`<div class="sys">${esc(n.check.skills)}で判定（技能の代用可）。初めての方は、そのまま振ってください<div class="row"><div><label>技能レベル</label><input id="sl" type="number" min="1" max="5" value="1"></div><div><label>判定値</label><input id="sv" type="number" min="1" max="12" value="4"></div></div></div><button class="btn" id="rl">ダイスを振る</button><div id="rr"></div>`;$('app').innerHTML=h;$('rl').onclick=()=>{const R=roll(+$('sl').value||1,+$('sv').value||1);const ok=R.s>=1;$('rl').hidden=true;$('rr').innerHTML=`<div class="sys">出目 ${R.r.join(', ')} → 成功数 ${R.s}<br><span class="roll">${ok?'成功':'失敗'}</span></div><button class="btn" id="nx">先へ</button>`;$('nx').onclick=()=>go(ok?n.check.ok:n.check.ng)};return}
if(n.number_input){h+=`<label>開く番号（1〜${G.total}）</label><input id="ni" type="number" min="1" max="${G.total}"><button class="btn" id="op">この番号を開く</button><div id="nr"></div>`}
const o=opts(n);o.forEach((c,i)=>h+=`<button class="btn" data-i="${i}">${esc(c.label)}</button>`);$('app').innerHTML=h;
document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>go(o[+x.dataset.i].to));
}
title();
</script></body></html>
