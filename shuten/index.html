<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>終点案内｜エモクロアTRPG 無料ソロシナリオ</title><meta name="description" content="町営バスに乗って、降りるだけの話。エモクロアTRPGの無料ソロ・DLレス短編『終点案内』。ブラウザで10〜20分、登録不要。"><meta property="og:title" content="終点案内｜エモクロアTRPG 無料ソロシナリオ"><meta property="og:description" content="ランプは最初から灯っている。〈次、とまります〉"><meta property="og:image" content="https://wandex-dev.github.io/junro/shuten/og.png"><meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#f5f1e8;--ink:#23201b;--mute:#6f685c;--line:#d6cfc1;--acc:#9c3b2e;--card:#fffdf8}
@media (prefers-color-scheme:dark){:root{--bg:#191714;--ink:#e8e2d5;--mute:#a59d8e;--line:#3a352d;--acc:#d9796a;--card:#221f1b}}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hiragino Mincho ProN','Yu Mincho',serif;font-size:17px;line-height:1.95}
main{max-width:680px;margin:0 auto;padding:20px 16px 90px}h1{font-size:44px;letter-spacing:.2em;margin:40px 0 4px;font-weight:600}.sub{color:var(--mute);font-size:14px;font-family:sans-serif}
h2{font:600 15px sans-serif;color:var(--acc);margin:0 0 10px}p{margin:0 0 14px}
.btn{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:8px 0;font:15px sans-serif;cursor:pointer;line-height:1.5}.btn:hover{border-color:var(--acc)}.btn:focus-visible{outline:2px solid var(--acc)}
.sys{background:var(--card);border-left:3px solid var(--acc);padding:10px 12px;margin:0 0 14px;font:14px/1.7 sans-serif}.roll{font-weight:600}
label{display:block;font:14px sans-serif;margin:10px 0 4px}input,select{font:16px sans-serif;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:100%}

.row{display:flex;gap:10px}.row>div{flex:1}.end{text-align:center;font-weight:600;margin-top:20px}.small{font:12px/1.7 sans-serif;color:var(--mute)}

.doc{background:#efe7d3;color:#231c14;border:1px solid #8d7d5e;padding:16px 18px;margin:0 0 16px;box-shadow:2px 3px 8px rgba(40,25,10,.18)}.doc p{margin:0 0 10px}.doc p:last-child{margin:0}
.lamp{position:sticky;top:0;z-index:5;text-align:center;font:700 13px sans-serif;letter-spacing:.2em;color:#fff;background:#a5301f;padding:5px 0;box-shadow:0 0 14px rgba(165,48,31,.7)}
.mapbox{max-width:320px;margin:4px auto 18px}
</style></head><body><div class="lamp" aria-hidden="true">次、とまります</div><main id="app"></main><div class="bar" id="bar" hidden></div>
<script>
const G={"nodes": {"start": {"id": "start", "title": "矢渡駅前", "text": ["矢渡駅を出ると、町営バスが一台だけ停まっていた。親戚の家までは、矢立橋で降りて歩いて五分と聞いている。", "乗り込むと、整理券の機械が小さく鳴った。券には番号がなく、〈終点まで〉とだけ印字されている。", "車内には五人の乗客がいた。全員が同じ姿勢で前を向き、話している者はいない。あなたは老女の隣の席に腰を下ろす。", "ドアが閉まる音はしなかった。バスは静かに走り出す。"], "choices": [{"label": "前を向く", "to": "stop_s1"}]}, "stop_s1": {"id": "stop_s1", "title": "役場前", "text": ["「次は、役場前。お降りの方は、お近くのボタンでお知らせください」", "女の声の録音だった。少し古い。ランプは最初から赤く灯っている。〈次、とまります〉。", "窓の外に町役場の白い壁が近づき、バスは速度を落とし、それからまた走り出した。誰も立たなかった。"], "set": ["s1"], "stop": true, "choices": [{"label": "降車ボタンを押す", "to": "press"}, {"label": "運賃表を見る", "to": "fare", "unless": ["c_fare"]}, {"label": "隣の老女に話しかける", "to": "old", "unless": ["c_old"]}, {"label": "首筋に当たる冷たい風のもとを探す", "to": "wind", "unless": ["c_door"]}, {"label": "運転席のそばまで歩いてみる", "to": "driver", "unless": ["f_driver"]}, {"label": "席を立ち、後ろの扉から降りる", "to": "off", "need": ["c_door"]}, {"label": "何もしない", "to": "rest"}]}, "stop_s2": {"id": "stop_s2", "title": "矢渡小学校前", "text": ["「次は、矢渡小学校前。お降りの方は、お近くのボタンでお知らせください」", "校門の脇の木に、子どもの字の札が下がっている。〈横断歩道は 先生の言う通りに〉。", "バスはまた速度を落とす。首筋に、すうっと冷たい空気が触れて、すぐに消えた。"], "set": ["s2"], "stop": true, "choices": [{"label": "降車ボタンを押す", "to": "press"}, {"label": "運賃表を見る", "to": "fare", "unless": ["c_fare"]}, {"label": "隣の老女に話しかける", "to": "old", "unless": ["c_old"]}, {"label": "首筋に当たる冷たい風のもとを探す", "to": "wind", "unless": ["c_door"]}, {"label": "運転席のそばまで歩いてみる", "to": "driver", "unless": ["f_driver"]}, {"label": "席を立ち、後ろの扉から降りる", "to": "off", "need": ["c_door"]}, {"label": "何もしない", "to": "rest"}]}, "stop_s3": {"id": "stop_s3", "title": "郷土記念館前", "text": ["「次は、郷土記念館前。お降りの方は、お近くのボタンでお知らせください」", "屋根つきの停留所に、和服の女性がひとり立っている。乗るつもりはないらしい。傘も持っていないのに、女性の足元だけが濡れていた。", "路面に白い矢印が見えた気がしたが、バスはもう走り出している。"], "set": ["s3"], "stop": true, "choices": [{"label": "降車ボタンを押す", "to": "press"}, {"label": "運賃表を見る", "to": "fare", "unless": ["c_fare"]}, {"label": "隣の老女に話しかける", "to": "old", "unless": ["c_old"]}, {"label": "首筋に当たる冷たい風のもとを探す", "to": "wind", "unless": ["c_door"]}, {"label": "運転席のそばまで歩いてみる", "to": "driver", "unless": ["f_driver"]}, {"label": "席を立ち、後ろの扉から降りる", "to": "off", "need": ["c_door"]}, {"label": "何もしない", "to": "rest"}]}, "stop_s4": {"id": "stop_s4", "title": "矢立橋", "text": ["「次は、矢立橋。お降りの方は、お近くのボタンでお知らせください」", "あなたの降りるはずの停留所だ。橋の欄干と、親戚の家の灯りが、窓の向こうに見えている。", "バスは速度を落とす。なのに、誰かが動く気配はない。灯りがゆっくり後ろへ流れていく。"], "set": ["s4"], "stop": true, "choices": [{"label": "降車ボタンを押す", "to": "press"}, {"label": "運賃表を見る", "to": "fare", "unless": ["c_fare"]}, {"label": "隣の老女に話しかける", "to": "old", "unless": ["c_old"]}, {"label": "首筋に当たる冷たい風のもとを探す", "to": "wind", "unless": ["c_door"]}, {"label": "運転席のそばまで歩いてみる", "to": "driver", "unless": ["f_driver"]}, {"label": "席を立ち、後ろの扉から降りる", "to": "off", "need": ["c_door"]}, {"label": "何もしない", "to": "rest"}]}, "stop_s5": {"id": "stop_s5", "title": "町民病院前", "text": ["「次は、町民病院前。お降りの方は、お近くのボタンでお知らせください」", "隣の老女が、窓の外の病棟を見上げた。三階の窓にひとつだけ灯りがある。老女は小さく頷いて、また前を向いた。", "運賃表の表示がひとつ進み、残りは一番下の、紙で隠された札だけになった。"], "set": ["s5"], "stop": true, "choices": [{"label": "降車ボタンを押す", "to": "press"}, {"label": "運賃表を見る", "to": "fare", "unless": ["c_fare"]}, {"label": "隣の老女に話しかける", "to": "old", "unless": ["c_old"]}, {"label": "首筋に当たる冷たい風のもとを探す", "to": "wind", "unless": ["c_door"]}, {"label": "運転席のそばまで歩いてみる", "to": "driver", "unless": ["f_driver"]}, {"label": "席を立ち、後ろの扉から降りる", "to": "off", "need": ["c_door"]}, {"label": "何もしない", "to": "rest"}]}, "press": {"id": "press", "title": "次、とまります", "text": ["ボタンを押す。音がしない。もう一度押す。指先に、古いゴムの感触だけが返ってくる。", "ランプは最初から灯っている。誰かが押したのだから、止まるはずだ。あなたの分はいらない。そう言われているようで、少しだけ肩の力が抜けた。", "その「少しだけ」が、ひどく心地よい。"], "res": {"s": 3, "u": 1}, "choices": [{"label": "バスは走り続ける", "to": "next"}]}, "rest": {"id": "rest", "title": "何もしない", "text": ["座席は思ったより温かい。降りるのは、次でもいいのではないかと思う。", "親戚の家に急ぐ理由を、あなたはうまく思い出せなかった。"], "res": {"s": 3, "u": 1}, "choices": [{"label": "バスは走り続ける", "to": "next"}]}, "fare": {"id": "fare", "title": "運賃表", "text": ["前方の運賃表に、停留所の名前が縦に並んでいる。読もうとすると、バスの揺れで字が滲む。"], "check": {"skills": "〈観察眼〉〈＊調査〉など", "ok": "fare_ok", "ng": "fare_ng"}}, "fare_ok": {"id": "fare_ok", "title": "〇円", "text": ["どの区間にも同じ数字が出ている。〇円。一番下の札にだけ紙が貼られ、ボールペンで〈終点〉と書かれている。", "紙の端がめくれていて、印刷の一部が読めた。〈……斎場前〉。", "乗ったときから料金がかからないバスなど、あるだろうか。払わなくていいものは、たいてい、もう払ったものだ。", "記録しておこう。［運賃：全区間〇円／終点は斎場前］"], "set": ["c_fare"], "res": {"s": 2, "u": 1}, "choices": [{"label": "バスは走り続ける", "to": "next"}]}, "fare_ng": {"id": "fare_ng", "title": "滲む字", "text": ["揺れがおさまらない。字を追ううちに目が疲れて、あなたは席に座り直す。次の停留所で、もう一度見てもいい。"], "choices": [{"label": "バスは走り続ける", "to": "next"}]}, "old": {"id": "old", "title": "隣の老女", "text": ["「あの、このバス、止まりますよね」", "老女はゆっくりこちらを向いた。膝の上で、色褪せた紙袋を両手で持っている。"], "check": {"skills": "〈説得〉〈心理〉〈直感〉など", "ok": "old_ok", "ng": "old_ng"}}, "old_ok": {"id": "old_ok", "title": "紙袋", "text": ["「止まりますよ。ランプがついているもの。誰かが押してくれたのね」", "紙袋の中には、丁寧に畳まれた男物の寝間着が入っていた。「主人にね、届けるの。病院前で降りるの」", "老女は窓の外を見て、少し困ったように笑う。", "「でも、皆さん座っていらっしゃるし。わたしだけ立つのも悪くてね。どなたかが降りるときに、一緒に降りようと思って」", "いつからですか、と聞くと、老女は指を折りかけて、やめた。寝間着の襟は、すっかり黄ばんでいる。", "記録しておこう。［老女：病院前で降りるつもり］"], "set": ["c_old"], "choices": [{"label": "バスは走り続ける", "to": "next"}]}, "old_ng": {"id": "old_ng", "title": "前を向く人", "text": ["「止まりますよ」とだけ言って、老女は前を向いた。それ以上話しかけるのは悪い気がして、あなたも前を向く。", "全員が前を向いていると、その方が正しいように思えてくる。"], "res": {"s": 2, "u": 1}, "choices": [{"label": "バスは走り続ける", "to": "next"}]}, "wind": {"id": "wind", "title": "冷たい風", "text": ["さっきから、停留所のたびに首筋が冷える。あなたは座席の背に手をかけて、後ろを振り返った。"], "check": {"skills": "〈＊知覚〉〈観察眼〉など", "ok": "door_ok", "ng": "door_ng"}}, "door_ok": {"id": "door_ok", "title": "後ろの扉", "text": ["後ろの扉の足元が濡れている。外の落ち葉が一枚、段の上に貼りついていた。", "次の減速を待って、あなたは目を凝らす。バスが完全に止まり、後ろの扉が、音もなく開いた。", "三秒。外の空気が流れ込み、扉はまた音もなく閉じる。バスが走り出す。", "通過なんてしていなかった。このバスは、すべての停留所で止まっていた。ボタンなど、どうでもよかったのだ。", "降りなかったのは、こちらのほうだ。", "記録しておこう。［後ろの扉：どの停留所でも三秒だけ開く］"], "set": ["c_door"], "choices": [{"label": "バスは走り続ける", "to": "next"}]}, "door_ng": {"id": "door_ng", "title": "気のせい", "text": ["振り返ると、一番後ろの席の男と目が合いそうになり、あなたは慌てて前を向いた。冷たい風は、もう止んでいる。", "次の停留所で、また確かめればいい。"], "choices": [{"label": "バスは走り続ける", "to": "next"}]}, "driver": {"id": "driver", "title": "運転席", "text": ["通路を前へ歩く。誰も顔を上げない。運転席との間には、古いカーテンが引かれていた。", "隙間から、制帽の後ろ姿が見える。声をかけても振り向かない。ハンドルを握る手は、白い手袋をしている。その手の位置が、一度も変わらない。", "カーテンの横に、色褪せた掲示がある。〈皆様ノ安全ノ為 走行中ハ席ヲ御立チニナラヌ様 御願ヒ申シ上ゲマス 矢渡町営〉。隅に小さく、〈印刷 矢印書房〉。", "あなたは、なぜか走行中でもないのに、席へ戻りたくなった。"], "set": ["f_driver"], "res": {"s": 3, "u": 1}, "choices": [{"label": "バスは走り続ける", "to": "next"}]}, "next": {"id": "next", "title": "次の停留所", "text": ["運賃表の表示がひとつ進む。"], "choices": [{"label": "終点へ", "to": "terminal", "auto": true, "need": ["s5"]}, {"label": "町民病院前へ", "to": "stop_s5", "auto": true, "need": ["s4"]}, {"label": "矢立橋へ", "to": "stop_s4", "auto": true, "need": ["s3"]}, {"label": "郷土記念館前へ", "to": "stop_s3", "auto": true, "need": ["s2"]}, {"label": "矢渡小学校前へ", "to": "stop_s2", "auto": true, "need": ["s1"]}]}, "off": {"id": "off", "title": "立つ", "text": ["バスが速度を落とす。あなたは立ち上がった。", "それだけで、車内の空気が変わった気がした。誰も見ていないのに、全員に見られている。あと少しで止まる。扉は三秒しか開かない。", "通路の先に、濡れた段が見える。誰にも許可は要らなかった。ただ、立つだけでよかった。"], "choices": [{"label": "「降りましょう」と、隣の老女に手を差し出す", "to": "end_true", "need": ["c_old"]}, {"label": "ひとりで降りる", "to": "end_museum", "need": ["s3"], "unless": ["s4"]}, {"label": "ひとりで降りる", "to": "end_bridge", "need": ["s4"], "unless": ["s5"]}, {"label": "ひとりで降りる", "to": "end_off", "unless": ["s3"]}, {"label": "ひとりで降りる", "to": "end_off", "need": ["s5"]}]}, "terminal": {"id": "terminal", "title": "終点", "text": ["「長らくのご乗車、ありがとうございました。次は、終点です」", "窓の外に灯りがなくなった。バスが止まり、前後の扉が同時に開く。今度は閉まらない。", "紙の剥がれた札が読めた。〈矢渡町営 斎場前〉。低い建物の入口に、黒白の幕が下がっている。", "誰も立たない。全員が前を向いている。隣の老女が小さな声で言った。", "「まだ、どなたも降りないみたいね」", "やがて録音の声が言う。「このバスは折り返し、矢渡駅前行きとなります」"], "res": {"s": 3, "u": 1}, "choices": [{"label": "それでも立ち上がる", "to": "end_last"}, {"label": "座ったままでいる", "to": "end_stay"}]}, "end_true": {"id": "end_true", "title": "結末：一緒に", "text": ["老女は差し出された手を、不思議そうに見た。", "「でも、皆さんが」", "「皆さんも、誰かが立つのを待っているんです」", "老女は紙袋を抱え直す。立ち上がる膝が、小さく鳴った。その音に、前の席の男の肩がぴくりと動く。", "バスが止まり、後ろの扉が開いた。あなたは老女の手を引いて段を下りる。三秒はとうに過ぎているのに、扉は閉まらなかった。", "振り返ると、ひとり、またひとりと、乗客が通路に立っている。誰も何も言わない。ただ順番に、ゆっくり降りてくる。それ $('go').onclick=()=>{S={name:$('nm').value.trim()||'あなた',lv:Math.max(1,Math.min(9,+$('lv').value||1)),lv0:Math.max(1,Math.min(9,+$('lv').value||1)),mt:$('mt').value,flags:[],prev:'start',node:'start',trail:[],entered:false,logs:[]};go('start')};
if($('cont'))$('cont').onclick=()=>{S=load();render()}}
function resDice(){const L=S.lv;return S.mt==='full'?L*2:S.mt==='root'?L+1:L}
function doRes(r){const R=roll(resDice(),r.s);let up=0;if(R.s>=1){up=r.u;if(R.s>=3)up+=1;S.lv+=up}return `<div class="sys">共鳴判定（強度${r.s}/上昇${r.u}）/ ∞共鳴感情：[${G.emotion}]<br>出目 ${R.r.join(', ')} → 成功数 ${R.s}<br><span class="roll">${up?`〈∞共鳴〉が ${up} 上昇して ${S.lv} になった`:'共鳴は上昇しなかった'}</span></div>`}
function go(id){const n=G.nodes[id];const fromRoom=S.prevRoom||'start';S.node=id;let pre='';
(n.set||[]).forEach(f=>{if(!S.flags.includes(f))S.flags.push(f)});
if(n.stop){S.trail.push(n.title)}
if(n.res)pre+=doRes(n.res);
if(n.lower){const o=S.lv;S.lv=Math.max(1,S.lv-n.lower);pre+=`<div class="sys roll">〈∞共鳴〉が ${o} から ${S.lv} になった</div>`}
S.pre=pre;if(S.lv>=10&&id!=='end_deviate'){S.pre=pre;S.lv=10;S.dev=true;return go2dev(pre)}S.result='';save();render();scrollTo(0,0)}
function go2dev(pre){S.node='end_deviate';S.pre=pre;S.result='';save();render();scrollTo(0,0)}
function passCard(title,rooms,color){const c=document.createElement('canvas');c.width=1200;c.height=630;const x=c.getContext('2d');x.fillStyle='#120e0a';x.fillRect(0,0,1200,630);const g=x.createRadialGradient(600,315,40,600,315,640);g.addColorStop(0,color+'55');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,1200,630);x.strokeStyle='#efe6d2';x.lineWidth=3;x.strokeRect(28,28,1144,574);x.fillStyle='#efe6d2';x.textAlign='center';x.font="600 110px 'Hiragino Mincho ProN','Yu Mincho',serif";x.fillText(title,600,190);x.font="600 34px 'Hiragino Mincho ProN','Yu Mincho',serif";x.fillText('通過しました',600,256);x.font="400 28px 'Hiragino Mincho ProN','Yu Mincho',serif";const w=[];let l='';for(const ch of rooms){if(x.measureText(l+ch).width>1000){w.push(l);l=''}l+=ch}w.push(l);w.slice(0,4).forEach((t,i)=>x.fillText(t,600,330+i*44));x.font="700 28px 'Hiragino Kaku Gothic ProN',sans-serif";x.fillText('エモクロアTRPG｜シナリオ制作 矢印書房｜yajirushi-shobo.booth.pm',600,560);const a=document.createElement('a');a.download=title+'_通過カード.png';a.href=c.toDataURL('image/png');a.click()}
function addShare(rooms){const url=G.booth;const txt=`エモクロアTRPG『終点案内』に乗りました。\n通過した停留所：${rooms}\n\n#エモクロアTRPG #終点案内_矢印書房\n${url}`;
$('app').insertAdjacentHTML('beforeend',`<a class="btn" target="_blank" rel="noopener" href="${url}" style="background:#a5301f;color:#fff;border-color:#a5301f;text-align:center;font-weight:700;text-decoration:none;margin-top:18px">この話をPDFで無料でもらう（BOOTH）</a><p class="small" style="text-align:center">保存してあとで読み返せます。別の結末も6つあります。</p><a class="btn" target="_blank" rel="noopener" href="https://wandex-dev.github.io/junro/" style="text-align:center;text-decoration:none">同じ町のもう一つの話『順路』を体験する（約5分）</a><a class="btn" target="_blank" rel="noopener" href="https://wandex-dev.github.io/junro/shindan.html" style="text-align:center;text-decoration:none">矢渡町 住民診断（30秒）</a><div class="sys" style="margin-top:18px"><b>通過報告</b>（結末は書かれません）<p style="white-space:pre-wrap;margin:6px 0 8px;font-size:13px">${esc(txt)}</p><div class="row"><div><button class="btn" id="cp" style="text-align:center">文面をコピー</button></div><div><a class="btn" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${encodeURIComponent(txt)}">Xに投稿する</a></div></div><button class="btn" id="pc" style="text-align:center">通過カード（画像）を保存</button>${G.demo?'':'<p class="small" style="margin:8px 0 0"><a style="color:var(--acc)" target="_blank" rel="noopener" href="https://yajirushi-shobo.booth.pm/">矢印書房のショップ</a>をフォローすると、矢渡町の次の案内が届きます。矢渡町シリーズ第1作は<a style="color:var(--acc)" target="_blank" rel="noopener" href="https://wandex-dev.github.io/junro/">『順路』の無料体験版</a>から。</p>'}</div>`);
$('pc').onclick=()=>passCard('終点案内',rooms,'#c8402c');$('cp').onclick=()=>{const done=()=>{$('cp').textContent='コピーしました'};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,done)}else{done()}}}
function render(){const n=G.nodes[S.node];const b=$('bar');b.hidden=false;const rooms=S.trail.join(' → ')||'まだ走り出したばかり';
const notes={c_fare:'運賃：全区間〇円／終点は斎場前',c_old:'老女：病院前で降りるつもり',c_door:'後ろの扉：どの停留所でも三秒だけ開く'};
const got=S.flags.filter(f=>notes[f]).map(f=>notes[f]);
b.innerHTML=`<b>${esc(S.name)}</b>　〈∞共鳴〉<b>${S.lv}</b>　<details style="display:inline;margin:0"><summary style="display:inline;cursor:pointer">記録</summary><div>通過した停留所：${esc(rooms)}<br>${got.map(esc).join('<br>')||'記録なし'}</div></details>`;
let h=`<h2>${esc(n.title)}</h2>${S.pre||''}`;const tx=n.text.map(t=>`<p>${esc(t)}</p>`).join('');h+=n.doc?`<div class="doc">${tx}</div>`:tx;if(n.map&&G.mapSvg)h+=`<div class="mapbox">${G.mapSvg}</div>`;
if(n.ending){h+=`<div class="sys">通過した停留所：${esc(rooms)}</div><p class="end">── ${esc(n.ending)} ──</p><button class="btn" id="again">最初に戻る</button>`;clearSave();$('app').innerHTML=h;$('again').onclick=()=>{S=null;$('bar').hidden=true;title()};addShare(rooms);return}
if(n.check){h+=`<div class="sys">${esc(n.check.skills)}で判定（技能の代用可）<div class="row"><div><label>技能レベル</label><input id="sl" type="number" min="1" max="5" value="1"></div><div><label>判定値</label><input id="sv" type="number" min="1" max="12" value="4"></div></div></div><button class="btn" id="rl">ダイスを振る</button><div id="rr"></div>`;$('app').innerHTML=h;$('rl').onclick=()=>{const R=roll(+$('sl').value||1,+$('sv').value||1);const ok=R.s>=1;$('rl').hidden=true;$('rr').innerHTML=`<div class="sys">出目 ${R.r.join(', ')} → 成功数 ${R.s}<br><span class="roll">${ok?'成功':'失敗'}</span></div><button class="btn" id="nx">先へ</button>`;$('nx').onclick=()=>go(ok?n.check.ok:n.check.ng)};return}
if(n.number_input){h+=`<label>開く番号（1〜${G.total}）</label><input id="ni" type="number" min="1" max="${G.total}"><button class="btn" id="op">この番号を開く</button><div id="nr"></div>`}
const o=opts(n);o.forEach((c,i)=>h+=`<button class="btn" data-i="${i}">${esc(c.label)}</button>`);$('app').innerHTML=h;
document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>go(o[+x.dataset.i].to));
if(n.number_input)$('op').onclick=()=>{const v=+$('ni').value;if(!v)return;if(v===G.escape){go('exit');return}const t=G.off[String(v)]||'';const r=doRes({s:3,u:1});save();$('bar').querySelector('b+b');$('nr').innerHTML=`<div class="sys">${t?esc(t)+'<br>':''}見出しに〈非常口〉がない。ここは順路の中だ。</div>${r}`;if(S.lv>=10){S.lv=10;go2dev(r)}else{const bb=$('bar').querySelectorAll('b')[1];if(bb)bb.textContent=S.lv}}}
title();
</script></body></html>
